name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Paketleri kur
        run: npm install

      - name: Android projesini oluştur
        run: |
          npx cap add android
          # Sadece dikey ekran
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Uygulama ikonu
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ff8cc6' --splashBackgroundColor '#ffe3f3'

      - name: Senkronize et
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı yeniden adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PrensesGiydirme.apk

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: PrensesGiydirme-apk
          path: PrensesGiydirme.apk

      - name: Release olarak yayınla (telefondan kolay indirme)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Prenses Giydirme v1.0.${{ github.run_number }}
          body: Telefona indirip kurmak için aşağıdaki PrensesGiydirme.apk dosyasına dokunun.
          files: PrensesGiydirme.apk

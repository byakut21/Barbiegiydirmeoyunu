<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Prenses Giydirme</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe3f3; font-family: system-ui, sans-serif; touch-action: manipulation; }
  #app { display: flex; flex-direction: column; height: 100%; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  #stageWrap { flex: 1; min-height: 0; position: relative; display: flex; justify-content: center; }
  #stage { height: 100%; aspect-ratio: 300/560; max-width: 100%; border-radius: 0 0 28px 28px; overflow: hidden; box-shadow: 0 6px 20px #ff6fb555; }
  #stage svg, #stage { display: block; }
  .side { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 12px; }
  .side.left { right: auto; left: 10px; }
  .round { width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff; background: #ff6fb5; font-size: 32px; box-shadow: 0 4px 10px #0002; display: grid; place-items: center; padding: 0; }
  .round:active { transform: scale(.9); }
  #mute, #music { width: 48px; height: 48px; font-size: 22px; background: #fff; }
  #music.off { opacity: .4; }
  #stage [data-part] { cursor: pointer; }
  .wiggle .doll { animation: wg .6s; transform-origin: 150px 300px; }
  @keyframes wg { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } 75% { transform: rotate(-2deg); } }
  .twirl .doll { animation: tw .8s; transform-origin: 150px 300px; }
  @keyframes tw { 0% { transform: scaleX(1); } 50% { transform: scaleX(-1); } 100% { transform: scaleX(1); } }
  .hop .doll { animation: hp .6s; }
  @keyframes hp { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-30px); } 60% { transform: translateY(0); } 80% { transform: translateY(-10px); } }
  #options { display: flex; gap: 12px; overflow-x: auto; padding: 12px; background: #fff; scroll-behavior: smooth; align-items: center; min-height: 112px; }
  #options::-webkit-scrollbar { display: none; }
  .opt { flex: 0 0 auto; width: 88px; height: 88px; border-radius: 22px; border: 4px solid #ffd1ea; background: #fff7fc; padding: 4px; position: relative; display: grid; place-items: center; transition: transform .15s; }
  .opt svg { width: 100%; height: 100%; }
  .opt.sel { border-color: #ff3d9a; transform: scale(1.08); box-shadow: 0 0 0 4px #ffb3d9; }
  .opt:active { transform: scale(.92); }
  .sw { width: 60px; height: 60px; border-radius: 50%; display: block; border: 3px solid #0001; }
  .emo { position: absolute; bottom: 2px; right: 4px; font-size: 26px; }
  .none { font-size: 40px; }
  .sep { flex: 0 0 4px; height: 70px; background: #ffd1ea; border-radius: 2px; }
  #tabs { display: flex; justify-content: space-around; background: #ff6fb5; padding: 8px 4px; gap: 4px; }
  .tab { flex: 1; height: 64px; font-size: 34px; border: none; border-radius: 18px; background: transparent; padding: 0; }
  .tab.on { background: #fff; box-shadow: 0 3px 8px #0002; }
  #fx { position: fixed; inset: 0; pointer-events: none; }
  .spark { position: absolute; font-size: 30px; animation: up 1.2s ease-out forwards; opacity: 0; }
  @keyframes up { 0% { opacity: 0; transform: translateY(0) scale(.3); } 20% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0; transform: translateY(-80px) scale(.8); } }
  .bounce { animation: bn .4s; }
  @keyframes bn { 0%,100% { transform: scale(1); } 40% { transform: scale(1.03, .97); } 70% { transform: scale(.98, 1.03); } }
  .doll, .armL, .armR, .legL, .legR { transform-box: view-box; }
  .armL { transform-origin: 118px 210px; } .armR { transform-origin: 182px 210px; }
  .legL { transform-origin: 138px 330px; } .legR { transform-origin: 162px 330px; }
  /* DANS */
  .dance .doll { animation: dn 4s ease-in-out; transform-origin: 150px 500px; }
  @keyframes dn { 0%,100% { transform: none; } 10% { transform: rotate(-7deg) translateY(-12px); } 20% { transform: rotate(7deg); } 30% { transform: rotate(-7deg) translateY(-12px); } 40% { transform: rotate(7deg); }
    50% { transform: scaleX(-1); } 60% { transform: translateY(-20px); } 70% { transform: rotate(-7deg); } 80% { transform: rotate(7deg) translateY(-12px); } 90% { transform: translateY(-24px); } }
  .dance .armL { animation: wavL .5s ease-in-out 8 alternate; }
  .dance .armR { animation: wavR .5s ease-in-out 8 alternate; }
  @keyframes wavL { from { transform: rotate(110deg); } to { transform: rotate(165deg); } }
  @keyframes wavR { from { transform: rotate(-165deg); } to { transform: rotate(-110deg); } }
  .dance .legL { animation: kick .5s ease-in-out 8 alternate; }
  .dance .legR { animation: kick .5s ease-in-out 8 alternate-reverse; }
  @keyframes kick { from { transform: rotate(0); } to { transform: rotate(14deg); } }
  /* YÜRÜYÜŞ */
  .walk .doll { animation: wk 6s linear; transform-origin: 150px 300px; }
  @keyframes wk { 0% { transform: translateX(0); } 22% { transform: translateX(75px); } 26% { transform: translateX(75px) scaleX(-1); }
    72% { transform: translateX(-75px) scaleX(-1); } 76% { transform: translateX(-75px); } 100% { transform: translateX(0); } }
  .walk .legL { animation: stp .5s ease-in-out 12 alternate; }
  .walk .legR { animation: stp .5s ease-in-out 12 alternate-reverse; }
  @keyframes stp { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
  .walk .armL { animation: swg .5s ease-in-out 12 alternate-reverse; }
  .walk .armR { animation: swg .5s ease-in-out 12 alternate; }
  @keyframes swg { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
  #walk { background: #3ddc97; }
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <svg id="stage" viewBox="0 0 300 560" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="side">
      <button class="round" id="rand">🎲</button>
      <button class="round" id="dance" style="background:#b36bff">💃</button>
      <button class="round" id="walk">🚶‍♀️</button>
    </div>
    <div class="side left"><button class="round" id="mute">🔊</button><button class="round small" id="music">🎵</button></div>
  </div>
  <div id="options"></div>
  <div id="tabs"></div>
</div>
<div id="fx"></div>
<script src="draw.js"></script>
<script src="app.js"></script>
</body>
</html>

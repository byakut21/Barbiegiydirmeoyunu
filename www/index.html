<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Prenses Giydirme</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe3f3; font-family: system-ui, sans-serif; touch-action: manipulation; }
  #app { display: flex; flex-direction: column; height: 100%; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  #stageWrap { flex: 1; min-height: 0; position: relative; display: flex; justify-content: center; }
  #stage { height: 100%; aspect-ratio: 300/560; max-width: 100%; border-radius: 0 0 28px 28px; overflow: hidden; box-shadow: 0 6px 20px #ff6fb555; }
  #stage svg, #stage { display: block; }
  .side { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 12px; }
  .side.left { right: auto; left: 10px; }
  .round { width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff; background: #ff6fb5; font-size: 32px; box-shadow: 0 4px 10px #0002; display: grid; place-items: center; padding: 0; }
  .round:active { transform: scale(.9); }
  #mute, #music { width: 48px; height: 48px; font-size: 22px; background: #fff; }
  #music.off { opacity: .4; }
  #stage [data-part] { cursor: pointer; }
  .wiggle .doll { animation: wg .6s; transform-origin: 150px 300px; }
  @keyframes wg { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } 75% { transform: rotate(-2deg); } }
  .twirl .doll { animation: tw .8s; transform-origin: 150px 300px; }
  @keyframes tw { 0% { transform: scaleX(1); } 50% { transform: scaleX(-1); } 100% { transform: scaleX(1); } }
  .hop .doll { animation: hp .6s; }
  @keyframes hp { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-30px); } 60% { transform: translateY(0); } 80% { transform: translateY(-10px); } }
  #options { display: flex; gap: 12px; overflow-x: auto; padding: 12px; background: #fff; scroll-behavior: smooth; align-items: center; min-height: 112px; }
  #options::-webkit-scrollbar { display: none; }
  .opt { flex: 0 0 auto; width: 88px; height: 88px; border-radius: 22px; border: 4px solid #ffd1ea; background: #fff7fc; padding: 4px; position: relative; display: grid; place-items: center; transition: transform .15s; }
  .opt svg { width: 100%; height: 100%; }
  .opt.sel { border-color: #ff3d9a; transform: scale(1.08); box-shadow: 0 0 0 4px #ffb3d9; }
  .opt:active { transform: scale(.92); }
  .sw { width: 60px; height: 60px; border-radius: 50%; display: block; border: 3px solid #0001; }
  .emo { position: absolute; bottom: 2px; right: 4px; font-size: 26px; }
  .none { font-size: 40px; }
  .sep { flex: 0 0 4px; height: 70px; background: #ffd1ea; border-radius: 2px; }
  #tabs { display: flex; justify-content: space-around; background: #ff6fb5; padding: 8px 4px; gap: 4px; }
  .tab { flex: 1; height: 64px; font-size: 34px; border: none; border-radius: 18px; background: transparent; padding: 0; }
  .tab.on { background: #fff; box-shadow: 0 3px 8px #0002; }
  #fx { position: fixed; inset: 0; pointer-events: none; }
  .spark { position: absolute; font-size: 30px; animation: up 1.2s ease-out forwards; opacity: 0; }
  @keyframes up { 0% { opacity: 0; transform: translateY(0) scale(.3); } 20% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0; transform: translateY(-80px) scale(.8); } }
  .bounce { animation: bn .4s; }
  @keyframes bn { 0%,100% { transform: scale(1); } 40% { transform: scale(1.03, .97); } 70% { transform: scale(.98, 1.03); } }
  .doll, .bob, .armL, .armR, .legL, .legR, .headG, .skirt, .shadow, .eye, .wings { transform-box: view-box; }
  .armL { transform-origin: 118px 210px; } .armR { transform-origin: 182px 210px; }
  .legL { transform-origin: 138px 330px; } .legR { transform-origin: 162px 330px; }
  .headG { transform-origin: 150px 185px; } .skirt { transform-origin: 150px 268px; } .shadow { transform-origin: 150px 512px; }
  .wings { transform-origin: 150px 230px; }
  .eye { transform-box: fill-box; transform-origin: center; }
  .opt .name { position: absolute; bottom: -2px; left: 0; right: 0; text-align: center; font: 700 12px system-ui; color: #d6337f; background: #fffc; border-radius: 0 0 18px 18px; }
  .big { font-size: 44px; line-height: 1; }
  .dot { position: absolute; right: 6px; bottom: 6px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #0002; }
  #brush { position: fixed; display: none; pointer-events: none; font-size: 56px; transform: translate(-15%, -90%) rotate(-15deg); z-index: 10; filter: drop-shadow(0 3px 3px #0004); }
  body.makeup #stage { cursor: crosshair; touch-action: none; }
  .kiss { position: absolute; font-size: 40px; opacity: 0; animation: kissFly 1.8s ease-out forwards; }
  @keyframes kissFly { 0% { opacity: 0; transform: translate(0,0) scale(.3); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(2.2) rotate(20deg); } }

  /* ÖPÜCÜK */
  .kissing .mouthN { display: none; } .kissing .mouthK { display: inline; }
  .kissing .armR { animation: blow 1.4s ease-in-out; }
  @keyframes blow { 0%,100% { transform: rotate(0); } 25%,40% { transform: rotate(-158deg); } 60% { transform: rotate(-95deg); } 80% { transform: rotate(-95deg); } }
  .kissing .headG { animation: tilt 1.4s ease-in-out; }
  @keyframes tilt { 0%,100% { transform: rotate(0); } 30%,70% { transform: rotate(7deg); } }
  .kissing .eye { animation: blink 1.4s; }
  @keyframes blink { 0%,15%,85%,100% { transform: scaleY(1); } 25%,70% { transform: scaleY(.12); } }
  .kissing .doll { animation: kisshop 1.4s; transform-origin: 150px 512px; }
  @keyframes kisshop { 0%,100% { transform: none; } 20% { transform: translateY(-10px); } 35% { transform: none; } }

  /* DANS (8 sn koreografi) */
  .dance .doll { animation: dn 8s ease-in-out; transform-origin: 150px 510px; }
  @keyframes dn {
    0%,100% { transform: none; }
    4% { transform: rotate(-6deg); } 8% { transform: rotate(6deg); } 12% { transform: rotate(0); }
    15% { transform: translateY(-34px) scale(.98,1.04); } 18% { transform: translateY(0) scale(1.04,.96); } 21% { transform: translateY(-34px) scale(.98,1.04); } 25% { transform: translateY(0); }
    28% { transform: translateY(-10px) scaleX(0); } 31% { transform: translateY(-14px) scaleX(-1); } 34% { transform: translateY(-10px) scaleX(0); } 37% { transform: translateY(-6px) scaleX(1); } 40% { transform: none; }
    44% { transform: translateX(-34px) rotate(-4deg); } 48% { transform: translateX(0); } 52% { transform: translateX(34px) rotate(4deg); } 55% { transform: none; }
    58% { transform: translateY(-8px); } 61% { transform: none; } 64% { transform: translateY(-8px); } 67% { transform: none; } 70% { transform: translateY(-8px); }
    74% { transform: translateY(-50px) scaleX(0); } 77% { transform: translateY(-58px) scaleX(-1); } 80% { transform: translateY(-50px) scaleX(0); } 83% { transform: translateY(0) scaleX(1) scale(1.05,.95); }
    88% { transform: rotate(-4deg); } 95% { transform: rotate(-4deg) translateY(-6px); } }
  .dance .shadow { animation: sh 8s ease-in-out; }
  @keyframes sh { 0%,12%,18%,25%,40%,83%,100% { transform: scale(1); opacity: .12; } 15%,21% { transform: scale(.6); opacity: .06; } 77% { transform: scale(.45); opacity: .05; } }
  .dance .armL { animation: aL 8s ease-in-out; } .dance .armR { animation: aR 8s ease-in-out; }
  @keyframes aL { 0%,100% { transform: rotate(0); } 4%,10% { transform: rotate(35deg); } 14%,24% { transform: rotate(150deg); } 28%,38% { transform: rotate(90deg); }
    42% { transform: rotate(160deg); } 45% { transform: rotate(120deg); } 48% { transform: rotate(160deg); } 51% { transform: rotate(120deg); } 54% { transform: rotate(160deg); }
    57%,63%,69% { transform: rotate(-32deg); } 60%,66% { transform: rotate(10deg); } 74%,83% { transform: rotate(165deg); } 88%,96% { transform: rotate(140deg); } }
  @keyframes aR { 0%,100% { transform: rotate(0); } 4%,10% { transform: rotate(-35deg); } 14%,24% { transform: rotate(-150deg); } 28%,38% { transform: rotate(-90deg); }
    42% { transform: rotate(-120deg); } 45% { transform: rotate(-160deg); } 48% { transform: rotate(-120deg); } 51% { transform: rotate(-160deg); } 54% { transform: rotate(-120deg); }
    57%,63%,69% { transform: rotate(32deg); } 60%,66% { transform: rotate(-10deg); } 74%,83% { transform: rotate(-165deg); } 88%,96% { transform: rotate(-25deg); } }
  .dance .legL { animation: lL 8s ease-in-out; } .dance .legR { animation: lR 8s ease-in-out; }
  @keyframes lL { 0%,100%,12%,25%,40%,70%,83% { transform: rotate(0); } 15%,21% { transform: rotate(-12deg); } 44% { transform: rotate(18deg); } 52% { transform: rotate(-6deg); } 77% { transform: rotate(-15deg); } 88%,96% { transform: rotate(8deg); } }
  @keyframes lR { 0%,100%,12%,25%,40%,70%,83% { transform: rotate(0); } 15%,21% { transform: rotate(12deg); } 44% { transform: rotate(6deg); } 52% { transform: rotate(-18deg); } 77% { transform: rotate(15deg); } 88%,96% { transform: rotate(-22deg); } }
  .dance .skirt { animation: swish .5s ease-in-out 16 alternate; }
  @keyframes swish { from { transform: skewX(-6deg); } to { transform: skewX(6deg); } }
  .dance .headG { animation: nod .5s ease-in-out 16 alternate; }
  @keyframes nod { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  .dance .wings, .walk .wings { animation: flap .25s ease-in-out infinite alternate; }
  @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.8); } }
  body.disco #stageWrap::after { content: ''; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(circle at 25% 25%, #ff3b6b66, transparent 28%), radial-gradient(circle at 75% 35%, #4fc3ff66, transparent 28%), radial-gradient(circle at 50% 75%, #ffd23f55, transparent 30%);
    animation: disco .6s steps(3) infinite; }
  @keyframes disco { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }

  /* YÜRÜYÜŞ (8 sn) */
  .walk .doll { animation: wk 8s linear; transform-origin: 150px 300px; }
  @keyframes wk { 0% { transform: translateX(0); } 22% { transform: translateX(80px); } 27% { transform: translateX(80px) scaleX(-1); }
    72% { transform: translateX(-80px) scaleX(-1); } 77% { transform: translateX(-80px) scaleX(1); } 100% { transform: translateX(0); } }
  .walk .bob { animation: bob .45s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .walk .legL { animation: stp .45s ease-in-out infinite alternate; }
  .walk .legR { animation: stp .45s ease-in-out infinite alternate-reverse; }
  @keyframes stp { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
  .walk .armL { animation: swg .45s ease-in-out infinite alternate-reverse; }
  .walk .armR { animation: swg .45s ease-in-out infinite alternate; }
  @keyframes swg { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
  .walk.waving .armR { animation: wave .3s ease-in-out infinite alternate; }
  @keyframes wave { from { transform: rotate(-165deg); } to { transform: rotate(-125deg); } }
  .walk .headG { animation: nod .9s ease-in-out infinite alternate; }
  .walk .skirt { animation: swish .45s ease-in-out infinite alternate; }
  #walk { background: #3ddc97; }
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <svg id="stage" viewBox="0 0 300 560" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="side">
      <button class="round" id="rand">🎲</button>
      <button class="round" id="dance" style="background:#b36bff">💃</button>
      <button class="round" id="walk">🚶‍♀️</button>
    </div>
    <div class="side left"><button class="round" id="mute">🔊</button><button class="round small" id="music">🎵</button></div>
  </div>
  <div id="options"></div>
  <div id="tabs"></div>
</div>
<div id="fx"></div>
<div id="brush"></div>
<script src="draw.js"></script>
<script src="app.js"></script>
</body>
</html>
